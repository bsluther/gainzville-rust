[package]
name = "gv-import"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[[bin]]
name = "gv-import"
path = "bin/gv_import.rs"

[[test]]
name = "import_tests"
path = "tests/import_tests.rs"

[dependencies]
gv-core = { path = "../core" }
gv-client = { path = "../client" }

anyhow = { workspace = true }
chrono = { workspace = true }
fractional_index = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v5"] }

chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "2.2", features = ["server", "transport-io"] }
schemars = { version = "1", features = ["uuid1", "chrono04"] }
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
gv-sql = { path = "../gv-sql", default-features = false, features = ["sqlite"] }
